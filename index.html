<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ipz</title>
  <style>
    :root { --bg:#0f1115; --card:#1a1d24; --text:#f2f4f8; --muted:#8b93a3; --accent:#4f8cff; }
    * { box-sizing: border-box; margin: 0; }
    body { background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    header { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between;
             padding: 14px 20px; background: rgba(15,17,21,.9); backdrop-filter: blur(8px); border-bottom: 1px solid #262a33; }
    h1 { font-size: 22px; letter-spacing: 1px; }
    h1 span { color: var(--accent); }
    button.upload { background: var(--accent); color: #fff; border: 0; padding: 10px 18px; border-radius: 10px;
                    font-size: 15px; font-weight: 600; cursor: pointer; }
    button.upload:disabled { opacity: .6; cursor: wait; }
    #status { text-align: center; color: var(--muted); padding: 10px; min-height: 20px; font-size: 14px; }
    #status.error { color: #ff6b6b; }
    #grid { columns: 220px; column-gap: 12px; padding: 0 16px 24px; max-width: 1400px; margin: 0 auto; }
    #grid img { width: 100%; display: block; margin-bottom: 12px; border-radius: 10px; background: var(--card); cursor: zoom-in; }
    .empty { text-align: center; color: var(--muted); padding: 60px 20px; }
    #lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.92); display: none; align-items: center; justify-content: center; z-index: 10; cursor: zoom-out; }
    #lightbox.open { display: flex; }
    #lightbox img { max-width: 95vw; max-height: 95vh; border-radius: 6px; }
  </style>
</head>
<body>
  <header>
    <h1>ip<span>z</span></h1>
    <div>
      <input type="file" id="file" accept="image/*" multiple hidden>
      <button class="upload" id="btn">📤 Tải ảnh lên</button>
    </div>
  </header>
  <div id="status"></div>
  <main id="grid"></main>
  <div id="lightbox"><img alt=""></div>

  <script>
    const grid = document.getElementById('grid');
    const statusEl = document.getElementById('status');
    const fileInput = document.getElementById('file');
    const btn = document.getElementById('btn');
    const lightbox = document.getElementById('lightbox');
    let lastSignature = '';

    function setStatus(text, isError) {
      statusEl.textContent = text || '';
      statusEl.className = isError ? 'error' : '';
    }

    async function loadImages() {
      try {
        const res = await fetch('/api/images');
        const images = await res.json();
        const signature = images.map(i => i.url).join('|');
        if (signature === lastSignature) return;
        lastSignature = signature;
        grid.innerHTML = '';
        if (!images.length) {
          grid.innerHTML = '<div class="empty">Chưa có ảnh nào. Hãy là người đầu tiên tải ảnh lên!</div>';
          return;
        }
        for (const img of images) {
          const el = document.createElement('img');
          el.src = img.url;
          el.loading = 'lazy';
          el.alt = 'ảnh';
          el.onclick = () => { lightbox.querySelector('img').src = img.url; lightbox.classList.add('open'); };
          grid.appendChild(el);
        }
      } catch (e) {
        setStatus('Không kết nối được server', true);
      }
    }

    btn.onclick = () => fileInput.click();
    lightbox.onclick = () => lightbox.classList.remove('open');
    document.addEventListener('keydown', e => { if (e.key === 'Escape') lightbox.classList.remove('open'); });

    fileInput.onchange = async () => {
      if (!fileInput.files.length) return;
      const files = Array.from(fileInput.files);
      btn.disabled = true;
      let done = 0;
      const errors = [];
      for (const [i, f] of files.entries()) {
        setStatus('Đang tải lên ' + (i + 1) + '/' + files.length + '...');
        try {
          const res = await fetch('/api/upload', { method: 'POST', headers: { 'Content-Type': f.type }, body: f });
          const data = await res.json();
          if (!data.ok) throw new Error(data.error);
          done++;
        } catch (e) {
          errors.push(f.name + ': ' + e.message);
        }
      }
      if (errors.length) setStatus('Đã tải ' + done + ' ảnh. Lỗi — ' + errors.join('; '), true);
      else {
        setStatus('Đã tải lên ' + done + ' ảnh ✅');
        setTimeout(() => setStatus(''), 3000);
      }
      btn.disabled = false;
      fileInput.value = '';
      await loadImages();
    };

    loadImages();
    setInterval(loadImages, 5000); // tự cập nhật để thấy ảnh của người khác
  </script>
</body>
</html>
